<title>Algorithms Exam Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a CLRS figure plate on graph paper. Pseudocode + chapter graph up top,
   chapters as an adjacency list, each chapter's questions as an array A[0..n-1]
   whose cells go WHITE (untouched) -> GRAY (attempted) -> BLACK (solved). */
:root {
  --paper: #edf1f4;
  --sheet: #fbfcfd;
  --grid: #dfe6ec;
  --rule: #c4cfd9;
  --ink: #13203a;
  --ink-2: #4f5f78;
  --ink-3: #8592a6;
  --mark: #ffe24a;
  --mark-ink: #13203a;
  --vgray: #a8b2c0;
  --ok: #0b8257;
  --ok-bg: #dcf2e7;
  --bad: #c3343a;
  --bad-bg: #fbe4e4;
  --focus: #2f5bff;

  --f-display: "Martian Mono", "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", Cambria, "Times New Roman", serif;

  --t-xs: 0.75rem; --t-s: 0.875rem; --t-m: 1rem; --t-l: 1.125rem; --t-xl: 1.375rem; --t-2xl: 1.875rem; --t-3xl: 2.75rem;
  --r: 6px;
  --gutter: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c131c; --sheet: #111a25; --grid: #172130; --rule: #2a3748;
    --ink: #e6edf5; --ink-2: #a2b1c3; --ink-3: #6c7d92;
    --mark: #f3d43c; --mark-ink: #13203a; --vgray: #5a697c;
    --ok: #3fcb8c; --ok-bg: #0f2d22; --bad: #ff6f6f; --bad-bg: #3a1719; --focus: #84a0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c131c; --sheet: #111a25; --grid: #172130; --rule: #2a3748;
  --ink: #e6edf5; --ink-2: #a2b1c3; --ink-3: #6c7d92;
  --mark: #f3d43c; --mark-ink: #13203a; --vgray: #5a697c;
  --ok: #3fcb8c; --ok-bg: #0f2d22; --bad: #ff6f6f; --bad-bg: #3a1719; --focus: #84a0ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 var(--t-m)/1.55 var(--f-body);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 64px; }
.mono { font-family: var(--f-display); }
.m { font-family: var(--f-math); font-size: 1.06em; white-space: nowrap; }
.hint { color: var(--ink-3); font-size: var(--t-s); }
.note { color: var(--ink-2); font-size: var(--t-s); border-left: 3px solid var(--mark); padding-left: 10px; margin: 10px 0; }
.yes { color: var(--ok); }
sup, sub { line-height: 0; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { max-width: 1120px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 10px; display: flex; align-items: center; gap: 16px; }
.brand { font: 700 var(--t-s)/1 var(--f-display); letter-spacing: .02em; text-decoration: none; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .sq { width: 14px; height: 14px; background: var(--ink); display: inline-block; box-shadow: 4px 4px 0 var(--mark); }
.bar .spacer { flex: 1; }
.bar .stat { font: 500 var(--t-xs)/1 var(--f-display); color: var(--ink-2); white-space: nowrap; }
.iconbtn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r);
  font: 500 var(--t-xs)/1 var(--f-display); padding: 8px 10px; cursor: pointer; white-space: nowrap;
}
.iconbtn:hover { border-color: var(--ink-2); }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 32px; align-items: center; padding-block: 40px 24px; }
.eyebrow { font: 500 var(--t-xs)/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.hero h1 {
  font-family: var(--f-display); font-weight: 800; font-stretch: 112.5%;
  font-size: clamp(2rem, 1.3rem + 2.6vw, var(--t-3xl)); line-height: 1.04; letter-spacing: -0.02em;
  margin: 12px 0 18px; text-wrap: balance;
}
.hero h1 .hl { background: var(--mark); color: var(--mark-ink); padding: 0 .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.pseudo {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r);
  font: 400 var(--t-s)/1.75 var(--f-display); font-stretch: 87.5%;
  padding: 14px 0; margin: 0; overflow-x: auto;
}
.pseudo .ln { display: grid; grid-template-columns: 2.6em 1fr; padding-right: 14px; transition: background .25s; }
.pseudo .ln > i { font-style: normal; color: var(--ink-3); text-align: right; padding-right: 1em; user-select: none; }
.pseudo .ln.on { background: color-mix(in srgb, var(--mark) 24%, transparent); box-shadow: inset 4px 0 0 var(--mark); }
.pseudo .kw { font-weight: 700; }
.pseudo .proc { font-variant: small-caps; font-weight: 700; letter-spacing: .02em; }
.pseudo .cm { color: var(--ink-3); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font: 500 var(--t-xs)/1.4 var(--f-display); color: var(--ink-2); }
.hero-meta b { color: var(--ink); font-weight: 700; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet);
  font: 600 var(--t-s)/1 var(--f-display); padding: 11px 14px; border-radius: var(--r);
}
.btn:hover { box-shadow: 3px 3px 0 var(--mark); transform: translate(-1px, -1px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: 8px 11px; font-size: var(--t-xs); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }

.graph-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 10px 6px; min-width: 0; }
.graph-card .cap { display: flex; justify-content: space-between; gap: 12px; font: 500 var(--t-xs)/1.3 var(--f-display); color: var(--ink-2); padding: 2px 6px 6px; }
#chgraph { width: 100%; height: auto; display: block; }
#chgraph .e { stroke: var(--rule); stroke-width: 1.6; fill: none; }
#chgraph .e.tree { stroke: var(--ink); stroke-width: 2.2; }
#chgraph .e.run { stroke: var(--mark); stroke-width: 7; stroke-linecap: round; }
#chgraph .v { cursor: pointer; }
#chgraph .v circle.body { stroke: var(--ink); stroke-width: 2; fill: var(--sheet); transition: fill .35s, stroke .35s; }
#chgraph .v text.num { font: 700 13px var(--f-display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: fill .35s; }
#chgraph .v.gray circle.body { fill: var(--vgray); }
#chgraph .v.black circle.body { fill: var(--ink); }
#chgraph .v.black text.num { fill: var(--sheet); }
#chgraph .v.disc circle.body { fill: var(--mark); }
#chgraph .v.disc text.num { fill: var(--mark-ink); }
#chgraph .v .ring { fill: none; stroke: var(--mark); stroke-width: 4; stroke-linecap: round; }
#chgraph .v text.lbl { font: 500 10.5px var(--f-body); fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
#chgraph .v text.d { font: 500 9px var(--f-display); fill: var(--ink-3); text-anchor: middle; pointer-events: none; }
#chgraph .v:hover circle.body, #chgraph .v:focus-visible circle.body { stroke-width: 3.5; }
#chgraph .v:focus { outline: none; }

/* ---------- legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 var(--t-xs)/1.3 var(--f-display); color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 13px; height: 13px; border: 1.5px solid var(--ink); display: inline-block; background: var(--sheet); }
.sw.gray { background: var(--vgray); }
.sw.black { background: var(--ink); }
.sw.ns { background: repeating-linear-gradient(135deg, var(--mark) 0 3px, var(--sheet) 3px 6px); }

/* ---------- adjacency list of chapters ---------- */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 36px 0 12px; }
.sec-head h2 { font: 700 var(--t-xl)/1.2 var(--f-display); margin: 0; letter-spacing: -0.01em; }
.adj { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.chrow {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 18px; align-items: center;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 14px 16px; cursor: pointer; text-align: left; width: 100%;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.chrow:hover { border-color: var(--ink); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.chrow .idx { font: 800 var(--t-2xl)/1 var(--f-display); font-stretch: 112.5%; color: var(--ink); font-variant-numeric: tabular-nums; }
.chrow .idx small { display: block; font: 500 10px/1.2 var(--f-display); color: var(--ink-3); letter-spacing: .1em; margin-top: 6px; }
.chrow .main { min-width: 0; display: grid; gap: 6px; }
.chrow .t { margin: 0; font: 700 var(--t-l)/1.25 var(--f-body); text-wrap: balance; }
.chrow .proc { font: 600 var(--t-xs)/1.3 var(--f-display); font-variant: small-caps; letter-spacing: .03em; color: var(--ink-2); }
.chrow .blurb { color: var(--ink-2); font-size: var(--t-s); }
.chrow .count { text-align: right; font: 600 var(--t-xs)/1.4 var(--f-display); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chrow .count b { display: block; font-size: var(--t-xl); color: var(--ink); font-weight: 800; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.cells i { width: 10px; height: 10px; border: 1.2px solid var(--ink-3); background: var(--sheet); display: block; }
.cells i.g { background: var(--vgray); border-color: var(--vgray); }
.cells i.b { background: var(--ink); border-color: var(--ink); }
.cells i.ns { background: repeating-linear-gradient(135deg, var(--mark) 0 2px, var(--sheet) 2px 4px); border-color: var(--ink-3); }

details.sources { margin-top: 28px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 16px; }
details.sources summary { cursor: pointer; font: 600 var(--t-s)/1.4 var(--f-display); }
.srcgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px;
  padding: 4px 10px; font: 500 var(--t-xs)/1.3 var(--f-display); background: var(--sheet); color: var(--ink-2); white-space: nowrap;
}
.chip b { color: var(--ink); }
.foot { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; font: 500 var(--t-xs)/1.5 var(--f-display); color: var(--ink-3); }

/* ---------- chapter view ---------- */
.ch-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 22px; align-items: end; padding-block: 28px 18px; }
.ch-head .big { grid-row: span 2; font: 800 clamp(3rem, 2rem + 4vw, 5.5rem)/0.85 var(--f-display); font-stretch: 112.5%; letter-spacing: -0.04em; color: var(--ink); }
.ch-head .big.mark { -webkit-text-stroke: 2px var(--ink); color: var(--mark); }
.ch-head h1 { margin: 0; font: 700 clamp(1.4rem, 1.1rem + 1.2vw, var(--t-2xl))/1.15 var(--f-body); text-wrap: balance; }
.ch-head .proc { font: 600 var(--t-s)/1.3 var(--f-display); font-variant: small-caps; letter-spacing: .03em; color: var(--ink-2); }
.back { font: 600 var(--t-xs)/1 var(--f-display); text-decoration: none; color: var(--ink-2); display: inline-flex; gap: 6px; padding-top: 22px; cursor: pointer; background: none; border: 0; }
.back:hover { color: var(--ink); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tbtn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; cursor: pointer;
  font: 500 var(--t-xs)/1 var(--f-display); padding: 8px 12px; white-space: nowrap; color: var(--ink-2);
}
.tbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tbtn .n { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.toolbar .grow { flex: 1; }
.progress-txt { font: 600 var(--t-xs)/1.3 var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* the array navigator */
.arr-wrap { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px 6px; margin-bottom: 16px; }
.arr-label { font: 500 var(--t-xs)/1.2 var(--f-display); color: var(--ink-3); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
.arr { display: flex; overflow-x: auto; padding-bottom: 22px; scrollbar-width: thin; }
.arr button {
  position: relative; flex: 0 0 auto; width: 30px; height: 30px; margin-right: -1.5px;
  border: 1.5px solid var(--ink); background: var(--sheet); cursor: pointer; padding: 0;
  font: 600 10px/1 var(--f-display); color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.arr button.g { background: var(--vgray); color: var(--ink); }
.arr button.b { background: var(--ink); color: var(--sheet); }
.arr button.ns { background: repeating-linear-gradient(135deg, var(--mark) 0 3px, var(--sheet) 3px 6px); color: var(--mark-ink); }
.arr button.cur { z-index: 2; outline: 3px solid var(--mark); outline-offset: 0; }
.arr button.cur::after {
  content: "\25B2 i"; position: absolute; left: 50%; top: calc(100% + 3px); transform: translateX(-50%);
  font: 700 10px/1 var(--f-display); color: var(--ink); white-space: nowrap;
}

/* question card */
.qcard { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: var(--r); box-shadow: 6px 6px 0 var(--grid); }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.qhead .qi { font: 800 var(--t-m)/1 var(--f-display); }
.tag { font: 600 10.5px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 3px; padding: 5px 7px; color: var(--ink-2); white-space: nowrap; }
.tag.ns { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); }
.tag.st-b { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tag.st-g { background: var(--vgray); color: var(--ink); border-color: var(--vgray); }
.qhead .srcs { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.qbody { padding: 18px; min-width: 0; }
.qtext { font-size: var(--t-l); line-height: 1.6; max-width: 72ch; overflow-wrap: anywhere; }
.qtext p { margin: 0 0 .6em; }
.qtext ul, .sol ul, .sol ol { margin: .4em 0 .6em; padding-left: 1.3em; }

.code {
  font: 400 var(--t-s)/1.6 var(--f-display); font-stretch: 87.5%; background: var(--paper); border: 1px solid var(--rule);
  border-radius: var(--r); padding: 12px 14px; overflow-x: auto; margin: 12px 0; max-width: 100%; white-space: pre;
}
.tscroll { overflow-x: auto; max-width: 100%; margin: 12px 0; }
table.t { border-collapse: collapse; font: 500 var(--t-s)/1.35 var(--f-display); font-variant-numeric: tabular-nums; background: var(--sheet); }
table.t th, table.t td { border: 1px solid var(--rule); padding: 6px 10px; text-align: center; vertical-align: middle; }
table.t th { background: var(--paper); font-weight: 700; color: var(--ink); }
table.t td.hl, table.t th.hl { background: var(--mark); color: var(--mark-ink); font-weight: 800; }
table.t td:first-child:not(:only-child) { text-align: left; }

.figs { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0; }
.fig { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 8px; max-width: 100%; overflow-x: auto; }
.fig svg { display: block; max-width: 100%; height: auto; }
.fig .fcap { font: 600 var(--t-xs)/1 var(--f-display); color: var(--ink-2); padding: 2px 4px 6px; }
.g-e { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.g-hl { stroke: var(--mark); stroke-width: 9; stroke-linecap: round; fill: none; opacity: .95; }
.g-w { font: 600 12px var(--f-display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.g-n { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.8; }
.g-t { font: 700 13px var(--f-display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.g-lab { font: 700 11px var(--f-display); fill: var(--mark-ink); text-anchor: middle; dominant-baseline: central; }
.g-labbg { fill: var(--mark); stroke: var(--ink); stroke-width: 1; }
.g-ai { font: 500 10px var(--f-display); fill: var(--ink-3); text-anchor: middle; dominant-baseline: central; }
.g-cell { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.4; }

/* answers */
.opts { display: grid; gap: 8px; margin-top: 16px; max-width: 760px; }
.opts.grid, .opts.bank { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); max-width: none; }
.opt {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 10px 12px; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.opts.grid .opt, .opts.bank .opt { grid-template-columns: 22px minmax(0, 1fr); padding: 8px 10px; font-size: var(--t-s); }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .k { font: 700 var(--t-xs)/1 var(--f-display); border: 1.5px solid var(--ink-3); border-radius: 4px; height: 22px; display: grid; place-items: center; color: var(--ink-2); }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); animation: shake .32s; }
.opt.bad .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .55; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.verdict { margin-top: 14px; font: 700 var(--t-s)/1.3 var(--f-display); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }

.field { display: grid; gap: 6px; margin-top: 14px; max-width: 760px; }
.field label { font: 600 var(--t-xs)/1.2 var(--f-display); color: var(--ink-2); }
.field input, .field textarea, .match select {
  border: 1.5px solid var(--rule); background: var(--paper); border-radius: var(--r); padding: 10px 12px; width: 100%;
}
.field textarea { min-height: 110px; resize: vertical; font-family: var(--f-display); font-size: var(--t-s); font-stretch: 87.5%; }
.field input:focus, .field textarea:focus, .match select:focus { border-color: var(--ink); outline: none; }
.field input.ok { border-color: var(--ok); background: var(--ok-bg); }
.field input.bad { border-color: var(--bad); background: var(--bad-bg); }

.match { display: grid; gap: 8px; margin-top: 16px; }
.match .row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r); }
.match .row.ok { border-color: var(--ok); background: var(--ok-bg); }
.match .row.bad { border-color: var(--bad); background: var(--bad-bg); }
.match .row .fix { grid-column: 1 / -1; font: 600 var(--t-xs)/1.3 var(--f-display); color: var(--ok); }

window.QB_ALIASES = [];
window.also = function (id, src) { window.QB_ALIASES.push([id, src]); };
window.resolveAliases = function () {
  for (const [id, src] of window.QB_ALIASES) {
    const q = window.QB.find(x => x.id === id);
    if (q) { if (!q.src.includes(src)) q.src.push(src); }

};

/* tbl([[head...],[row...],...], {hl: [[r,c],...], cls}) -> HTML table string.
   First row is the header. Cells may contain HTML. */
window.tbl = function (rows, opt = {}) {
  const hl = new Set((opt.hl || []).map(([r, c]) => r + ',' + c));
  const rh = opt.rowHead !== false;
  let h = `<table class="t ${opt.cls || ''}">`;
  rows.forEach((row, r) => {
    h += '<tr>';
    row.forEach((cell, c) => {
      const tag = r === 0 && opt.head !== false ? 'th' : (c === 0 && rh && opt.head !== false ? 'th' : 'td');
      const k = hl.has(r + ',' + c) ? ' class="hl"' : '';
      h += `<${tag}${k}>${cell}</${tag}>`;
    });
    h += '</tr>';
  });
  return h + '</table>';
};

/* G({n:{a:[x,y]...}, e:'a-b:1 c>d:4', w:100, h:60, hl:'a-b', lab:{a:'0'}})
   Graph figure spec rendered to SVG by the UI.

window.G = function (spec) { return Object.assign({ type: 'graph' }, spec); };

/* "Complete the worst-case complexity table" rows from Final 2013, 2015 and 2016,
   split into one question per algorithm so each lands in its own chapter. */
{
const OPTS = ['O(log n)', 'O(n)', 'O(n + k)', 'O(n log n)', 'O(n²)', 'O(2ⁿ)', 'O(nW)', 'O(V + E)', 'O(E log V)', 'O((V + E) log V)', 'O(V²)', 'O(VE)'];
const I = Object.fromEntries(OPTS.map((o, i) => [o, i]));
const cx = (id, ch, src, algo, ans, sol) => Q({ id, ch, src, type: 'mcq', grid: true,
  q: `Worst-case running time of <b>${algo}</b>?`, opts: OPTS, ans: [].concat(ans).map(a => I[a]), sol });

cx('cx-ksdp', 'dp', ['Final 2013', 'Final 2016 S2'], '0/1 knapsack using dynamic programming', 'O(nW)', `The table has (n + 1)(W + 1) cells, each filled in O(1). (Pseudo-polynomial: W is a number, not an input length.)`);
cx('cx-ksbf', 'dp', ['Final 2013', 'Final 2015 S1'], '0/1 knapsack using brute force', 'O(2ⁿ)', `All 2ⁿ subsets of the n items are tried (each checked in O(n), so O(n·2ⁿ) strictly).`);
cx('cx-bfs', 'g1', ['Final 2013', 'Final 2016 S2'], 'breadth-first search (adjacency list)', 'O(V + E)', `Each vertex is enqueued once and each adjacency list scanned once.`);
cx('cx-dfs', 'g1', ['Final 2013', 'Final 2015 S1'], 'depth-first search (adjacency list)', 'O(V + E)', `Each vertex is visited once; each edge examined once (twice if undirected).`);

cx('cx-prim', 'g2', ['Final 2013', 'Final 2015 S1', 'Final 2016 S2'], "Prim's MST algorithm (binary heap)", 'O(E log V)', `V EXTRACT-MINs and up to E DECREASE-KEYs, each O(lg V): O((V + E) lg V) = O(E lg V) for a connected graph.`);

cx('cx-bellman', 'g3', ['Final 2013', 'Final 2015 S1'], 'Bellman-Ford', 'O(VE)', `|V| − 1 passes, each relaxing all |E| edges. (The 2013 key wrongly listed O(V + E).)`);
cx('cx-selection', 'sort1', 'Final 2015 S1', 'selection sort', 'O(n²)', `Always n(n − 1)/2 comparisons, whatever the input.`);

cx('cx-merge', 'sort1', 'Final 2016 S2', 'merge sort', 'O(n log n)', `T(n) = 2T(n/2) + Θ(n) in every case.`);
cx('cx-heapsort', 'heap', 'Final 2015 S1', 'heapsort', 'O(n log n)', `BUILD-MAX-HEAP O(n) + (n − 1) MAX-HEAPIFY calls of O(lg n).`);
cx('cx-heapify', 'heap', 'Final 2016 S2', 'MAX-HEAPIFY', 'O(log n)', `It walks down one root-to-leaf path: O(h) = O(lg n).`);
cx('cx-counting', 'linsort', 'Final 2015 S1', 'counting sort (n elements in the range 0..k)', 'O(n + k)', `Two loops over k counters and two loops over the n elements.`);

Q({
  id: 'f13-5a', ch: 'np', src: 'Final 2013', type: 'open',
  q: `Explain what P, NP and NP-Complete problems are. What is meant by "is P = NP?"`,
  sol: `<ul>
    <li><b>P</b> — decision problems solvable in polynomial time, O(n<sup>k</sup>), on a deterministic machine.</li>
    <li><b>NP</b> — decision problems whose candidate solution (certificate) can be <i>verified</i> in polynomial time (equivalently, solvable in polynomial time by a non-deterministic machine). P ⊆ NP.</li>
    <li><b>NP-Complete</b> — a problem that is in NP <i>and</i> every NP problem reduces to it in polynomial time (it is NP-hard).</li>
    <li><b>P = NP?</b> — asks whether every problem whose solution can be verified in polynomial time can also be <i>solved</i> in polynomial time. It is unproven; if any NP-complete problem had a polynomial algorithm, then P = NP.</li></ul>`
});

Q({
  id: 'f13-6a', ch: 'g3', src: 'Final 2013 (bonus)', type: 'open',
  q: `Let G = (V, E) be a weighted directed graph with <b>exactly one</b> negative-weight edge and no negative-weight cycles. Give an algorithm that finds the shortest distance from s to all vertices with the same running time as Dijkstra.`,
  sol: `<p>Let the negative edge be (u, v).</p><ol>
    <li>Remove (u, v) and run Dijkstra from s → distances d<sub>s</sub>[·].</li>
    <li>Run Dijkstra from v (edge still removed) → distances d<sub>v</sub>[·].</li>
    <li>For every vertex t: dist(s, t) = min( d<sub>s</sub>[t], d<sub>s</sub>[u] + w(u, v) + d<sub>v</sub>[t] ).</li></ol>
    <p>A shortest path uses the negative edge at most once (no negative cycles), so it either avoids it or is s ⇝ u → v ⇝ t. Two Dijkstra runs + O(V) combination = same asymptotic time as Dijkstra.</p>`
});

  q: `An <b>independent set</b> is a set of vertices no two of which are adjacent. Assume Independent-Set ∈ NP and the 3-CNF formula
     <span class="m">(x<sub>1</sub> ∨ x<sub>2</sub> ∨ ¬x<sub>3</sub>) ∧ (x<sub>2</sub> ∨ x<sub>3</sub> ∨ ¬x<sub>4</sub>) ∧ (x<sub>1</sub> ∨ ¬x<sub>2</sub> ∨ x<sub>4</sub>)</span>.
     Show (by reducing 3-CNF to a graph) that Independent Set is NP-complete. What is the size of the maximum independent set S? Hint: connect a literal to its negation.`,
  sol: `<p><b>Reduction.</b> For each clause make a triangle of its 3 literals (edges inside each clause). Also connect every literal x<sub>i</sub> to every occurrence of ¬x<sub>i</sub>. The formula with k clauses is satisfiable ⇔ the graph has an independent set of size k. Built in polynomial time, so 3-CNF ≤<sub>p</sub> Independent-Set; with IS ∈ NP, IS is NP-complete.</p>
    <p>(⇒) Pick one true literal from each clause: one vertex per triangle, and never both x and ¬x → independent, size k. (⇐) An independent set of size k has exactly one vertex per triangle and no complementary pair, so set those literals true → every clause satisfied.</p>
    <p><b>Max |S| = 3</b> (one per clause; e.g. x<sub>1</sub> = x<sub>2</sub> = x<sub>4</sub> = 1 lets us pick x<sub>1</sub> from clause 1, x<sub>2</sub> from clause 2 and x<sub>4</sub> from clause 3). It cannot exceed 3 since each triangle contributes at most one vertex.</p>`
});

Q({ id: 'f13b-ss', ch: 'np', src: S, type: 'open',
  q: `Subset-sum: given a set S of positive integers and a positive integer t, is there a subset S′ ⊆ S whose sum is exactly t? (e.g. S = {1, 2, 3, 14, 49, 98}, t = 101 → S′ = {1, 2, 98}).<br>Assuming subset-sum is NP-complete, show that the (0/1) <b>knapsack</b> problem is NP-complete by reducing subset-sum to knapsack.`,
  sol: `<p><b>Knapsack (decision):</b> given items with weights w<sub>i</sub>, values v<sub>i</sub>, capacity W and target V — is there a subset with Σw ≤ W and Σv ≥ V?</p>
    <p><b>1. Knapsack ∈ NP:</b> a certificate is the chosen subset; summing weights and values takes O(n).</p>
    <p><b>2. Reduction subset-sum ≤<sub>p</sub> knapsack:</b> for each s ∈ S create an item with <b>w = v = s</b>; set <b>W = V = t</b>. This takes O(n) time.</p>
    <p><b>3. Correctness:</b> if S′ sums to t, picking those items gives weight t ≤ W and value t ≥ V → yes. Conversely, a knapsack solution has Σs ≤ t and Σs ≥ t, hence Σs = t → a valid S′.</p>
    <p>Since a known NP-complete problem reduces to knapsack and knapsack ∈ NP, <b>knapsack is NP-complete</b>.</p>` });
}

Q({ id: 'f21-18', ch: 'intro', src: S, type: 'mcq', q: `Brute force algorithms:`,

Q({ id: 'f21-22', ch: 'np', src: S, type: 'mcq', q: `To prove that a problem X is NP-complete, you need to prove that:`,

Q({ id: 'f21-23', ch: 'np', src: S, type: 'mcq', q: `Problems that can be solved in polynomial time are known as:`,

Q({ id: 'f21-24', ch: 'np', src: S, type: 'tf', q: `If any NP-complete problem can be solved in polynomial time, then every problem in NP can also be solved in polynomial time.`, ans: true,

Q({ id: 'f21-25', ch: 'intro', src: S, type: 'tf', q: `Before designing an algorithm, you should decide first whether the solution is exact or approximate.`, ans: true,

Q({ id: 'f21-26', ch: 'np', src: S, type: 'mcq', q: `To solve the 3-SAT problem in reasonable time, you should <u>not</u> use:`,

Q({ id: 'f21-29', ch: 'np', src: S, type: 'mcq', q: `X is an NP problem and Y is an NP-complete problem. If Y ≤<sub>p</sub> X, then X is:`,
  opts: ['NP-complete', 'NP-hard', 'Both a and b', 'All the above answers are incorrect'], ans: 2,

Q({ id: 'f21-30', ch: 'np', src: S, type: 'mcq', q: `If you have a problem that is NP-complete, it is preferable to:`,
  opts: ['search for an optimal solution', 'find a solution using approximation algorithms', 'search for a polynomial-time algorithm to solve it', 'All the above answers are incorrect'], ans: 1, sol: `Settle for near-optimal approximations instead of an intractable exact search.` });
Q({ id: 'f21-31', ch: 'np', src: S, type: 'tf', q: `Consider problems X and Y. If X is an NP problem and X is polynomial-time reducible to Y, then Y is an NP problem.`, ans: true,
  sol: `The course slides state: "If R ≤<sub>p</sub> Q and R is NP, Q is also NP" → expected answer <b>True</b>. <span class="note">Mathematically this does not follow — a reduction X ≤<sub>p</sub> Y only shows Y is at least as hard as X (Y could even be undecidable). Answer True on this course's exams.</span>` });
Q({ id: 'f21-32', ch: 'np', src: S, type: 'tf', q: `Showing that TSP ≤<sub>p</sub> HAM-CYCLE can be used to prove that TSP is NP-complete.`, ans: false,

Q({ id: 'f23a-th', ch: 'anB', src: S, type: 'open', q: `Show that <span class="m">f(n) = 3n² + 2n + 4</span> is Θ(n²) and find the constants c<sub>1</sub>, c<sub>2</sub> and n<sub>0</sub>.`,

Q({ id: 'f23c-th', ch: 'anB', src: S, type: 'open', q: `Find Θ, c<sub>1</sub>, c<sub>2</sub>, n<sub>0</sub> for <span class="m">f(n) = n² + √n</span>.`,
  sol: `<p>For n ≥ 1, √n ≤ n², so n² ≤ n² + √n ≤ 2n².</p><p><b>f(n) = Θ(n²)</b> with c<sub>1</sub> = 1, c<sub>2</sub> = 2, n<sub>0</sub> = 1.</p>` });
Q({ id: 'f23c-it', ch: 'dc', src: S, type: 'open', q: `Give the tight bound of <span class="m">T(n) = 4T(n/2) + n²</span> using (1) the iteration method and (2) the master method.`,
  sol: `<p><b>Iteration:</b> T(n) = 4T(n/2) + n² = 16T(n/4) + 4(n/2)² + n² = 16T(n/4) + 2n² = 64T(n/8) + 3n² = … = 4<sup>k</sup>T(n/2<sup>k</sup>) + kn².</p>
        <p>n/2<sup>k</sup> = 1 → k = lg n: T(n) = n²·T(1) + n² lg n = <b>Θ(n² lg n)</b>.</p>
        <p><b>Master:</b> a = 4, b = 2, n<sup>log<sub>2</sub>4</sup> = n² = f(n) → case 2 → Θ(n² lg n).</p>` });
Q({ id: 'f23c-foo', ch: 'dc', src: S, type: 'open', q: `Determine the complexity of this code in Big-O (hint: recursion tree).` + code(`foo(n) {
  if (n == 0) return;
  foo(n - 1);
  foo(n - 1);
  print n;
}`),
  sol: `<p>T(n) = 2T(n − 1) + c. The recursion tree is a full binary tree of depth n: level i has 2<sup>i</sup> calls each doing c work.</p>
        <p>Total = c(1 + 2 + 4 + … + 2<sup>n</sup>) = c(2<sup>n+1</sup> − 1) = <b>O(2ⁿ)</b>.</p>` });

/* Final 2024 — 1st semester (model answer shown in class) */
{
const S = 'Final 2024 S1';

Q({ id: 'f24a-1', ch: 'anB', src: S, type: 'mcq',
  q: `What is the closest time complexity of <span class="m">f(n) = n log 4 + log n</span>?`,
  opts: ['O(n)', 'O(n log n)', 'O(log n)', 'O(n log(n²))'], ans: 0,
  sol: `log 4 is a constant, so n log 4 = Θ(n), which dominates log n → O(n).` });

Q({ id: 'f24a-2', ch: 'np', src: S, type: 'mcq',
  q: `To which class does the CNF-satisfiability problem belong?`,
  opts: ['NP', 'P', 'NP-complete', 'NP-hard', 'All answers are incorrect'], ans: 2,
  sol: `CNF-SAT is in NP (a truth assignment is checked in polynomial time) and is NP-hard (Cook–Levin), hence NP-complete — the most precise answer.` });

Q({ id: 'f24a-3', ch: 'dc', src: S, type: 'mcq',
  q: `Using the master method, <span class="m">T(n) = 2T(n/2) + n log n</span> is:`,
  opts: ['Θ(n)', 'Θ(n log n)', 'Θ(log n)', "Can't solve"], ans: 3,
  sol: `n<sup>log<sub>2</sub>2</sup> = n. f(n) = n lg n is larger than n, but not <i>polynomially</i> larger (n lg n / n = lg n &lt; n<sup>ε</sup> for every ε &gt; 0). It falls in the gap between case 2 and case 3, so the basic master method cannot solve it. (The answer is Θ(n lg² n), e.g. by a recursion tree.)` });

Q({ id: 'f24a-4', ch: 'dp', src: S, type: 'mcq',
  q: `A 0/1 knapsack problem has 6 items. How many item combinations must the brute-force approach examine?`,
  opts: ['6', '12', '32', '64'], ans: 3,
  sol: `Each item is in or out → 2<sup>6</sup> = 64 subsets.` });

Q({ id: 'f24a-5', ch: 'dp', src: S, type: 'mcq',
  q: `Which technique efficiently solves optimization problems by breaking them into smaller <b>overlapping</b> subproblems while avoiding redundant calculations?`,
  opts: ['Divide and conquer', 'Branch and bound', 'Dynamic programming', 'Greedy'], ans: 2,
  sol: `Overlapping subproblems + storing results (table/memo) = dynamic programming.` });

Q({ id: 'f24a-6', ch: 'np', src: S, type: 'mcq',
  q: `For the graph coloring problem, which statement is the <b>optimization</b> version?`,
  opts: ['For a graph G = (V, E) and an integer k, can G be colored using k colors?', 'Determine the chromatic number of a graph G = (V, E).', 'For G and k, how many distinct k-colorings are possible?', 'None of the above.'], ans: 1,
  sol: `Finding the minimum number of colors (chromatic number) is the optimization problem; "can it be colored with k colors?" is the decision version.` });

Q({ id: 'f24a-7', ch: 'g3', src: S, type: 'mcq',
  q: `Shortest paths to all vertices of a graph from a given vertex are obtained by:`,
  opts: ["Kruskal's algorithm", 'BFS', "Dijkstra's algorithm", 'DFS'], ans: 2,
  sol: `Single-source shortest paths on a weighted graph → Dijkstra. (BFS only works if all edges have equal weight; Kruskal builds an MST.)` });

Q({ id: 'f24a-8', ch: 'g1', src: S, type: 'mcq',
  q: `The Breadth First Search algorithm uses a ______ data structure for its implementation.`,
  opts: ['Queue', 'Stack', 'Tree', 'All the above answers are incorrect'], ans: 0,
  sol: `BFS processes vertices in FIFO order using a queue (DFS uses a stack / recursion).` });

Q({ id: 'f24a-9', ch: 'sort1', src: S, type: 'mcq',
  q: `List = [7, 11, 3, 10, 17, 23, 1, 4, 21, 5]. What is the partially sorted list after <b>three complete passes</b> of insertion sort in <b>descending</b> order?`,
  opts: ['11, 10, 7, 3, 17, 23, 1, 4, 21, 5', '11, 17, 23, 10, 7, 21, 5, 4, 3, 1', '3, 7, 11, 10, 17, 23, 1, 4, 21, 5', '23, 21, 17, 10, 3, 7, 1, 4, 11, 5', 'None of the above'], ans: 0,
  sol: `Pass 1 inserts 11 → [11, 7, 3, …]. Pass 2 inserts 3 → [11, 7, 3, …] (already in place). Pass 3 inserts 10 → [11, 10, 7, 3, 17, 23, 1, 4, 21, 5]. Only the first four elements are sorted so far.` });

Q({ id: 'f24a-10', ch: 'sort1', src: S, type: 'mcq',
  q: `What is the recurrence relation of Merge Sort?`,
  opts: ['T(n) = T(n−2) + O(n)', 'T(n) = T(n−1) + O(n)', 'T(n) = 2T(n/2) + O(n)', 'T(n) = T(n/2) + T(n) + O(1)'], ans: 2,
  sol: `Two halves sorted recursively, then a linear-time MERGE: T(n) = 2T(n/2) + Θ(n) = Θ(n lg n).` });

Q({ id: 'f24a-asy', ch: 'anB', src: S, type: 'open',
  q: `For each pair f(n) (rows) and g(n) (columns), write O, Ω or Θ depending on whether f = O(g), f = Ω(g) or f = Θ(g). Give only the strongest relation (lg = log<sub>2</sub>).` +
    tbl([['f \\ g', 'n', 'n lg n', 'n²'], ['n lg² n', '', '', ''], ['2<sup>lg² n</sup>', '', '', ''], ['lg(n!)', '', '', ''], ['n<sup>lg 3</sup>', '', '', '']]),
  sol: tbl([['f \\ g', 'n', 'n lg n', 'n²'], ['n lg² n', 'Ω', 'Ω', 'O'], ['2<sup>lg² n</sup>', 'Ω', 'Ω', 'Ω'], ['lg(n!)', 'Ω', 'Θ', 'O'], ['n<sup>lg 3</sup>', 'Ω', 'Ω', 'O']]) +
    `<ul><li>n lg² n = (n lg n)·lg n: above n lg n, below n².</li>
     <li>2<sup>lg² n</sup> = (2<sup>lg n</sup>)<sup>lg n</sup> = n<sup>lg n</sup>: super-polynomial, above all three.</li>
     <li>lg(n!) = Θ(n lg n) (Stirling).</li>
     <li>n<sup>lg 3</sup> ≈ n<sup>1.585</sup>: between n lg n and n².</li></ul>` });

Q({ id: 'f24a-mm', ch: 'dc', src: S, type: 'open',
  q: `Solve with the master method: <span class="m">T(n) = 2T(n/3) + n²</span>.`,
  sol: `<p>a = 2, b = 3, n<sup>log<sub>3</sub>2</sup> ≈ n<sup>0.63</sup>. f(n) = n² = Ω(n<sup>0.63 + ε</sup>) (e.g. ε = 1).</p>
        <p>Regularity: a·f(n/b) = 2(n/3)² = (2/9)n² ≤ c·n² with c = 2/9 &lt; 1 ✓.</p>
        <p><b>Case 3 → T(n) = Θ(n²).</b></p>` });

Q({ id: 'f24b-s2', ch: 'anB', src: S, type: 'short',
  q: `If f(n) = log n, then f(n) = ω(______).`, accept: ['1', 'c', 'constant', 'loglogn', 'log log n', 'lglgn'],
  sol: `Any function that grows strictly slower than log n, e.g. <b>1</b> (a constant) or log log n. ω is a strict (non-tight) lower bound.` });

Q({ id: 'f24b-s3', ch: 'g1', src: S, type: 'short',
  q: `______ algorithm can be used to identify the strongly connected components.`, accept: ['dfs', 'depth first search', 'depth-first search'],
  sol: `<b>DFS</b> — run DFS to get finishing times, run DFS on Gᵀ in decreasing finish order; each tree of the second DFS is an SCC.` });

Q({ id: 'f24b-s4', ch: 'g2', src: S, type: 'short',
  q: `The number of edges in a spanning tree of an n-vertex undirected graph is ______ edges.`, accept: ['n-1', 'n - 1', '|v|-1'],
  sol: `<b>n − 1</b>: a tree on n vertices always has n − 1 edges.` });

Q({ id: 'f24b-s5', ch: 'sort1', src: S, type: 'short',
  q: `______ is a stable and in-place sorting algorithm.`, accept: ['insertion sort', 'insertion', 'bubble sort', 'bubble'],
  sol: `<b>Insertion sort</b> (bubble sort also qualifies). Merge sort is stable but not in place; heapsort is in place but not stable.` });

Q({ id: 'f24b-s6', ch: 'dc', src: S, type: 'short',
  q: `For T(n) = T(n/4) + 2n, the size of each subproblem generated at each step is ______ the size of the original problem.`, accept: ['1/4', 'quarter', 'one quarter', 'one fourth', '1/4 of'],
  sol: `<b>1/4</b> — the argument is n/4 (b = 4).` });

Q({ id: 'f24b-s7', ch: 'dc', src: S, type: 'short',
  q: `The asymptotic relationship between T<sub>1</sub>(n) = 4T(n/2) + n² and T<sub>2</sub>(n) = T(n/2) + 1 is T<sub>1</sub>(n) = ___(T<sub>2</sub>(n)).`, accept: ['ω', 'omega', 'Ω', 'little omega', 'big omega', 'w'],
  sol: `T<sub>1</sub>: a = 4, b = 2, n<sup>log 4</sup> = n² = f(n) → case 2 → Θ(n² lg n). T<sub>2</sub>: a = 1, b = 2, n⁰ = 1 = f(n) → case 2 → Θ(lg n). So T<sub>1</sub> = <b>Ω(T<sub>2</sub>)</b> — in fact ω(T<sub>2</sub>).` });

Q({ id: 'f24b-s8', ch: 'linsort', src: S, type: 'short',
  q: `To apply ______ sort, each input should be an integer.`, accept: ['counting', 'counting sort', 'radix', 'radix sort'],
  sol: `<b>Counting sort</b> uses the keys as array indices, so they must be (small) integers. (Radix sort also works digit-by-digit on integers.)` });

Q({ id: 'f24b-s9', ch: 'dc', src: S, type: 'short',
  q: `If T(n) = 2T(n/2) + n, then case ______ of the master method applies.`, accept: ['2', 'two', 'case 2'],
  sol: `n<sup>log<sub>2</sub>2</sup> = n = f(n) → <b>case 2</b> → Θ(n lg n).` });

Q({ id: 'f24b-s10', ch: 'heap', src: S, type: 'short',
  q: `The MAX-HEAPIFY procedure on a max-heap runs in O(______).`, accept: ['lgn', 'log n', 'logn', 'lg n', 'h', 'log(n)'],
  sol: `<b>O(lg n)</b> — it floats a value down one path of a tree of height ⌊lg n⌋ (O(h)).` });

Q({ id: 'f24b-s11', ch: 'anB', src: S, type: 'short',
  q: `If f(n) = o(g(n)), then ______ grows faster.`, accept: ['g', 'g(n)', 'gn'],
  sol: `<b>g(n)</b>: little-o means f(n)/g(n) → 0.` });

Q({ id: 'f24b-s12', ch: 'anA', src: S, type: 'short',
  q: `Optimal solutions for searching unsorted data by comparing keys require Θ(______) comparisons.`, accept: ['n'],
  sol: `<b>Θ(n)</b> — without order, every element may have to be inspected (linear search).` });

Q({ id: 'f24b-s13', ch: 'anB', src: S, type: 'short',
  q: `If f(n) = n⁴ + n and g(n) = 2ⁿ + n, then f(n) + g(n) = O(______).`, accept: ['2^n', '2n', '2ⁿ'],
  sol: `O(max(f, g)) = <b>O(2ⁿ)</b> — exponential beats every polynomial.` });

Q({ id: 'f24b-s14', ch: 'sort1', src: S, type: 'short',
  q: `______ is a sorting algorithm that follows the divide-and-conquer approach.`, accept: ['merge sort', 'merge', 'mergesort', 'quick sort', 'quicksort'],
  sol: `<b>Merge sort</b> (quicksort as well).` });

Q({ id: 'f24b-m1', ch: 'np', src: S, type: 'mcq',
  q: `If a problem R is NP-Complete, then:`, opts: ['R is NP', 'R is NP-hard', 'Both answers a and b are correct', 'Both answers a and b are incorrect'], ans: 2,
  sol: `NP-complete = in NP and NP-hard.` });
Q({ id: 'f24b-m2', ch: 'np', src: S, type: 'mcq',

Q({ id: 'f24c-it', ch: 'dc', src: S, type: 'open',

  sol: `<b>No.</b> The master theorem only applies to T(n) = aT(n/b) + f(n) with a ≥ 1 and b &gt; 1, i.e. the subproblem size must be a <i>fraction</i> n/b of n. Here the size shrinks by subtraction (n − 1), so there is no b.` });

Q({ id: 'f24c-ms4', ch: 'sort1', src: S, type: 'open',
  q: `Revise merge sort so that it divides the n-element sequence into <b>four</b> subsequences of n/4 elements each (instead of two). Give the pseudocode and its complexity.`,
  sol: code(`MERGE-SORT-4(A, p, r)
  if p < r
      len = r - p + 1
      q1 = p + ⌊len/4⌋ - 1
      q2 = p + ⌊len/2⌋ - 1
      q3 = p + ⌊3·len/4⌋ - 1
      MERGE-SORT-4(A, p,      q1)
      MERGE-SORT-4(A, q1 + 1, q2)
      MERGE-SORT-4(A, q2 + 1, q3)
      MERGE-SORT-4(A, q3 + 1, r)
      MERGE(A, p, q1, q2)        // merge parts 1 and 2
      MERGE(A, q2 + 1, q3, r)    // merge parts 3 and 4
      MERGE(A, p, q2, r)         // merge the two halves`) +
    `<p>(Alternatively, a 4-way merge that repeatedly takes the minimum of four fronts — still Θ(n) per call.)</p>
     <p><b>Recurrence:</b> T(n) = 4T(n/4) + Θ(n). Master method: a = 4, b = 4, n<sup>log<sub>4</sub>4</sup> = n = f(n) → case 2 → <b>T(n) = Θ(n lg n)</b> — same order as ordinary merge sort.</p>` });

    <p><b>c)</b> Swap A[1] ↔ A[5] → [1, 5, 3, 4 | 10], heap-size 4, MAX-HEAPIFY(1): 1 ↔ 5 → [5, 1, 3, 4], 1 ↔ 4 → <b>[5, 4, 3, 1, 10]</b>.</p>

  q: `Solve <span class="m">T(n) = 2T(n/2) + n</span>, T(1) = 1, with the <b>iteration method</b>. What is T(n) after expanding to the k<sup>th</sup> step?`,
  opts: ['T(n) = 2<sup>k</sup> T(n/2<sup>k</sup>) + k·n', 'T(n) = 2<sup>k</sup> T(n/2<sup>k</sup>) + Σ<sub>i=0</sub><sup>log n</sup> n/2<sup>i</sup>', 'T(n) = 2T(n/2<sup>k</sup>) + k·n', 'T(n) = 2<sup>k</sup> T(n/2<sup>k</sup>) + n<sup>k</sup>'], ans: 0,
  sol: `<p>T(n) = 2T(n/2) + n = 2[2T(n/4) + n/2] + n = 4T(n/4) + 2n = 8T(n/8) + 3n = … = <b>2<sup>k</sup>T(n/2<sup>k</sup>) + kn</b>.</p>
        <p>Each level contributes exactly n. Stop at n/2<sup>k</sup> = 1 → k = lg n, so T(n) = n·T(1) + n lg n = Θ(n lg n).</p>` });

Q({ id: 'f26b-2', ch: 'linsort', src: S, type: 'mcq',
  q: `Input A = [1, 3, 2, 5, 4, 3, 7, 6, 2, 1]. When <b>Counting Sort</b> is applied, what is the counter array C after the <b>third loop</b> completes?`,
  opts: ['C = [2, 2, 2, 1, 1, 1, 1]', 'C = [2, 4, 6, 7, 8, 9, 10]', 'C = [1, 3, 5, 6, 7, 8, 9]', 'C = [2, 4, 5, 6, 8, 9, 10]'], ans: 1,
  sol: `<p>Loop 1 zeroes C. Loop 2 counts occurrences of values 1..7: [2, 2, 2, 1, 1, 1, 1]. Loop 3 makes it cumulative (C[i] = number of elements ≤ i):</p>
        <p class="m">[2, 4, 6, 7, 8, 9, 10]</p><p>(Loop 4 then places elements into B from right to left.)</p>` });

Q({ id: 'f26b-3', ch: 'dc', src: S, type: 'mcq',

  opts: ['Dynamic programming', 'Greedy', 'Divide and conquer', 'Brute force'], ans: 2,

Q({ id: 'f26b-4', ch: 'linsort', src: S, type: 'mcq',
  q: `Which statement is TRUE regarding Radix Sort?`,
  opts: ['Radix Sort is a comparison-based sorting algorithm.', 'Radix Sort starts the sorting from the Most Significant Digit.', 'Radix Sort must use a stable sorting algorithm.', 'The space complexity of Radix Sort is always O(1).'], ans: 2,
  sol: `LSD radix sort sorts digit by digit starting from the <i>least</i> significant digit, and each pass must be stable so the order from earlier digits is preserved. It is not comparison-based and needs extra space (e.g., counting sort uses O(n + k)).` });

Q({ id: 'f26b-5', ch: 'dc', src: S, type: 'mcq',
  q: `Using the master method on <span class="m">T(n) = ½ T(n/2) + 2n</span>:`,
  opts: ['Case 1, T(n) = Θ(n<sup>log 0.5</sup>)', 'Case 2, T(n) = Θ(n<sup>log 0.5</sup> log n)', 'Case 3, T(n) = Θ(n)', 'Master method cannot be used.'], ans: 3,
  sol: `The master theorem requires a ≥ 1 and b &gt; 1. Here a = ½ &lt; 1 (fewer than one subproblem makes no sense), so it does not apply.` });

Q({ id: 'f26b-6', ch: 'np', src: S, type: 'mcq',
  q: `Which statement best describes a <b>Hamiltonian cycle</b>?`,
  opts: ['A cycle that visits every edge of a graph exactly once.', 'A cycle that contains all the vertices of the graph exactly once and returns to the starting vertex.', 'A path that contains all the edges of the graph exactly once.', 'A path that connects two vertices using the minimum total weight.'], ans: 1,
  sol: `Hamiltonian = every <b>vertex</b> exactly once, returning to the start. (Every <i>edge</i> once is an Euler tour.)` });

Q({ id: 'f26b-7', ch: 'g1', src: S, type: 'mcq',
  q: `BFS on a graph stored as an adjacency list with V vertices and E edges runs in:`,
  opts: ['O(V²)', 'O(E log V)', 'O(V + E)', 'O(VE)'], ans: 2,
  sol: `Each vertex is enqueued/dequeued once (O(V)) and each adjacency list is scanned once (O(E)). With an adjacency matrix it would be O(V²).` });

Q({ id: 'f26b-8', ch: 'g1', src: S, type: 'mcq',
  q: `Running DFS on a graph with several disconnected components — which statement is correct?`,
  opts: ['DFS always produces exactly one DFS tree regardless of the graph structure.', 'DFS cannot be applied to disconnected graphs.', 'DFS produces multiple trees only when the graph contains cycles.', 'DFS may produce more than one DFS tree, resulting in a DFS forest.'], ans: 3,
  sol: `DFS restarts from every still-white vertex, so each restart creates a new tree → a depth-first forest.` });

Q({ id: 'f26b-9', ch: 'g3', src: S, type: 'mcq',
  q: `At each step of Dijkstra's algorithm, which vertex is selected next?`,
  opts: ['The unvisited vertex with the largest degree.', 'The unvisited vertex with the smallest distance from the source.', 'A random unvisited vertex.', 'The most recently visited vertex.'], ans: 1,
  sol: `EXTRACT-MIN on the priority queue: the vertex with the smallest tentative distance d[v] — the greedy choice.` });

Q({ id: 'f26b-10', ch: 'g3', src: S, type: 'mcq',
  q: `When Dijkstra's algorithm terminates, what information do we get?`,
  opts: ['Only the shortest path to one destination.', 'The minimum spanning tree of the graph.', 'All cycles in the graph.', 'The shortest distance from the source to every reachable vertex.'], ans: 3,

const bf = { n: { A: [340, 508], B: [462, 442], C: [466, 570], D: [570, 502] }, e: 'A>B:4 A>C:5 B>C:-2 B>D:6 D>B:1 C>D:3' };
Q({ id: 'f26b-bf', ch: 'g3', src: S, type: 'open',
  q: `Apply the <b>Bellman-Ford algorithm</b> from source <b>A</b>, relaxing edges in the order <span class="m">BC → BD → DB → CD → AB → AC</span>. Fill the d and π table after <b>each pass</b>.`,
  fig: G(bf),
  sol: `<p>Initial: d = (A 0, B ∞, C ∞, D ∞), π all nil.</p>
    <p><b>Pass 1</b> — BC, BD, DB, CD: tails are ∞, nothing changes. AB: d[B] = 4, π = A. AC: d[C] = 5, π = A.</p>` +
    tbl([['Pass 1', 'A', 'B', 'C', 'D'], ['d', '0', '4', '5', '∞'], ['π', '—', 'A', 'A', '—']]) +
    `<p><b>Pass 2</b> — BC: 4 + (−2) = 2 &lt; 5 → d[C] = 2, π = B. BD: 4 + 6 = 10 → d[D] = 10, π = B. DB: 11 &gt; 4, no. CD: 2 + 3 = 5 &lt; 10 → d[D] = 5, π = C. AB, AC: no change.</p>` +
    tbl([['Pass 2', 'A', 'B', 'C', 'D'], ['d', '0', '4', '2', '5'], ['π', '—', 'A', 'B', 'C']]) +
    `<p><b>Pass 3</b> (|V| − 1 = 3) — no edge relaxes (DB: 6 &gt; 4; BD: 10 &gt; 5 …). Table unchanged.</p>` +
    tbl([['Pass 3', 'A', 'B', 'C', 'D'], ['d', '0', '4', '2', '5'], ['π', '—', 'A', 'B', 'C']]) +
    `<p>Final check finds no further relaxation → no negative cycle (cycle B→C→D→B weighs −2 + 3 + 1 = 2). Shortest paths: B: A→B (4), C: A→B→C (2), D: A→B→C→D (5).</p>`,

4  sort the edges of G.E into nondecreasing order by weight w
5  for each edge (u, v) ∈ G.E, taken in nondecreasing order by weight
6      if FIND-SET(u) ≠ FIND-SET(v)
7          A = A ∪ {(u, v)}
8          UNION(u, v)
9  return A`) + `a) If the edge weights are uniformly distributed over [0, 1), how can Kruskal be made more efficient? b) What is the overall time complexity of the modified algorithm?`,
  sol: `<p><b>a)</b> Replace the comparison sort on line 4 with <b>bucket sort</b>: uniform keys in [0, 1) are sorted in expected O(E) time instead of O(E lg E).</p>
    <p><b>b)</b> Lines 2–3: O(V). Line 4: O(E) expected. Lines 5–8: E FIND-SET/UNION operations. The model answer gives <b>O(V + E + E lg V) = O(E lg V)</b>, counting each disjoint-set operation as O(lg V). (With union by rank + path compression they cost O(α(V)), making the whole algorithm almost linear, O(E α(V)) expected.)</p>` });

while i <= n do
    j ← 2
    while j <= i
        print j
        j ← j * 2
    endwhile
    i ← i + 1
endwhile`),
  sol: `The outer loop runs n times; for a given i the inner loop doubles j, running ⌊lg i⌋ times. Total Σ<sub>i=1..n</sub> lg i = lg(n!) = Θ(n lg n) → <b>O(n log n)</b>.` });

Q({ id: 'm24c-cs', ch: 'linsort', src: S, type: 'open', q: `How many loops are there in the counting sort algorithm? Give each one's Big-O, and the overall running time.`,
  sol: code(`COUNTING-SORT(A, B, k)
1  for i = 0 to k             C[i] = 0                 // O(k)
2  for j = 1 to A.length      C[A[j]] = C[A[j]] + 1    // O(n)
3  for i = 1 to k             C[i] = C[i] + C[i-1]     // O(k)
4  for j = A.length downto 1  B[C[A[j]]] = A[j]
                              C[A[j]] = C[A[j]] - 1    // O(n)`) +

      j = i + 1
      while (j < List.Length) {
          if (SmallestElement > List[j])
              SmallestElement = List[j]
          j = j + 1
      }
      Swap(List[i], SmallestElement)
      i = i + 1
  }

  sol: `This is selection sort. For each i the inner loop runs n − i − 1 times: Σ<sub>i=0..n−1</sub>(n − i − 1) = n(n − 1)/2 → <b>O(n²)</b> (Θ(n²) in every case, since the scans don't stop early).` });

function chapterGraphSVG() {
  const ek = (a, b) => [a, b].sort().join('|');
  let s = `<svg id="chgraph" viewBox="0 0 800 462" role="group" aria-label="Chapter graph: each vertex is a chapter, edges link chapters that build on each other">`;
  for (const [a, b] of GEDGES) { const p = GNODES[a], q = GNODES[b]; s += `<line class="e" data-e="${ek(a, b)}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`; }
  for (const c of CH) {
    const [x, y, lbl] = GNODES[c.id]; const stt = chStats(c.id); const frac = stt.m ? stt.r / stt.m : 0;
    const circ = 2 * Math.PI * 27;
    s += `<g class="v ${chColor(stt)}" data-ch="${c.id}" tabindex="0" role="link" aria-label="Chapter ${c.n}: ${esc(c.title)}">
      <circle class="ring" cx="${x}" cy="${y}" r="27" stroke-dasharray="${(frac * circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>
      <circle class="body" cx="${x}" cy="${y}" r="21"/><text class="num" x="${x}" y="${y}">${c.n}</text>
      <text class="lbl" x="${x}" y="${y + 41}">${esc(lbl)}</text>
      <text class="d" x="${x}" y="${y - 32}">d=${BFS.d[c.id]}</text></g>`;
  }
  return s + '</svg>';
}
let graphTimer = null, animatedOnce = false;
function runBFSAnimation() {
  const svg = document.getElementById('chgraph'); if (!svg) return;
  const lines = [...document.querySelectorAll('.pseudo .ln[data-l]')];
  const setLine = l => lines.forEach(x => x.classList.toggle('on', +x.dataset.l === l));
  if (reduced || animatedOnce) { setLine(6); return; }
  animatedOnce = true;
  const real = {};
  svg.querySelectorAll('.v').forEach(g => { real[g.dataset.ch] = g.getAttribute('class'); g.setAttribute('class', 'v'); });
  let k = 0, prev = null;
  graphTimer = setInterval(() => {
    if (prev) svg.querySelector(`.v[data-ch="${prev}"]`).setAttribute('class', real[prev]);
    if (k >= BFS.order.length) { clearInterval(graphTimer); graphTimer = null; setLine(6); return; }
    const [v, p] = BFS.order[k];
    svg.querySelector(`.v[data-ch="${v}"]`).setAttribute('class', 'v disc');
    if (p) {
      const e = svg.querySelector(`.e[data-e="${[v, p].sort().join('|')}"]`);
      if (e) { e.classList.add('run'); setTimeout(() => { e.classList.remove('run'); e.classList.add('tree'); }, 260); }
    }
    setLine(Math.min(5, 1 + Math.floor(k * 5 / BFS.order.length)));
    prev = v; k++;
  }, 200);
}

function stopTimers() { if (graphTimer) { clearInterval(graphTimer); graphTimer = null; } }

function legendHTML() {
  return `<div class="legend"><span><i class="sw"></i>WHITE · untouched</span><span><i class="sw gray"></i>GRAY · attempted</span><span><i class="sw black"></i>BLACK · solved</span><span><i class="sw ns"></i>needs your answer</span></div>`;
}
function sourcesList() {
  const m = {};
  QB.forEach(q => q.src.forEach(s => { m[s] = (m[s] || 0) + 1; }));
  const kind = s => /^Final/.test(s) ? 0 : /^Mid/.test(s) ? 1 : /^Quiz|^Eval/.test(s) ? 2 : 3;
  return Object.keys(m).sort((a, b) => kind(a) - kind(b) || ((b.match(/20\d\d/) || [0])[0] - (a.match(/20\d\d/) || [0])[0]) || a.localeCompare(b))
    .map(s => `<span class="chip">${esc(s)} <b>${m[s]}</b></span>`).join('');
}
function unsolvedExport() {

}

function filterList(base, f) {
  if (f === 'quick') return base.filter(q => q.type === 'tf' || q.type === 'mcq');
  if (f === 'prob') return base.filter(q => !['tf', 'mcq'].includes(q.type) && !q.unsolved);
  if (f === 'todo') return base.filter(q => !q.unsolved && st(q.id) !== 'r');
  if (f === 'ns') return base.filter(q => q.unsolved);
  return base;
}
function openChapter(chId, keepHash) {
  stopTimers();
  view.mode = 'ch'; view.ch = chId; view.filter = 'all'; view.shuffled = false;
  view.base = chapterQs(chId); view.list = view.base.slice();
  const lastId = store.last[chId]; const li = view.list.findIndex(q => q.id === lastId);
  view.i = li >= 0 ? li : 0;
  if (!keepHash) setHash('ch-' + chId);
  renderChapter(); window.scrollTo(0, 0);
}
function openMix(keepHash) {
  stopTimers();
  view.mode = 'mix'; view.ch = 'mix'; view.filter = 'all'; view.shuffled = true;
  view.base = shuffle(QB.filter(q => !q.unsolved)).slice(0, 10); view.list = view.base.slice(); view.i = 0;
  if (!keepHash) setHash('mix');
  renderChapter(); window.scrollTo(0, 0);
}
function setHash(h) {
  const want = h ? '#' + h : '';
  if (location.hash === want) return;
  try { history.pushState(null, '', want || location.pathname + location.search); } catch (e) { /* history blocked */ }
}

function renderChapter() {
  const isMix = view.mode === 'mix';
  const c = isMix ? { n: 'R', title: 'Randomized quiz', proc: 'Randomized-Quiz(Q, 10)' } : chById[view.ch];
  const counts = { all: view.base.length, quick: filterList(view.base, 'quick').length, prob: filterList(view.base, 'prob').length, todo: filterList(view.base, 'todo').length, ns: filterList(view.base, 'ns').length };
  const solved = view.base.filter(q => st(q.id) === 'r').length;
  const fbtn = (k, label) => counts[k] || k === 'all' ? `<button class="tbtn" type="button" data-filter="${k}" aria-pressed="${view.filter === k}">${label}<span class="n">${counts[k]}</span></button>` : '';
  $app.innerHTML = topBar() + `<main class="wrap">
    <button class="back" type="button" data-home>← Adj[course]</button>
    <header class="ch-head"><div class="big${isMix ? ' mark' : ''}">${isMix ? 'R' : pad2(c.n)}</div><h1>${esc(c.title)}</h1><div class="proc">${esc(c.proc)}</div></header>
    <div class="toolbar">
      ${fbtn('all', 'All')}${fbtn('quick', 'Choice & T/F')}${fbtn('prob', 'Problems')}${fbtn('todo', 'Unfinished')}${fbtn('ns', 'Not solved')}
      <span class="grow"></span>
      ${isMix ? `<button class="tbtn" type="button" data-redraw>New draw</button>` : `<button class="tbtn" type="button" data-shuffle aria-pressed="${view.shuffled}">Shuffle</button>`}
      <span class="progress-txt">solved ${solved} / ${view.base.filter(q => !q.unsolved).length}</span>
    </div>
    <div class="arr-wrap"><div class="arr-label"><span>Q[0‥${Math.max(view.list.length - 1, 0)}]  n = ${view.list.length}</span><span>${legendHTML().replace('class="legend"', 'class="legend" style="gap:4px 12px"')}</span></div>
      <div class="arr" id="arr" role="tablist" aria-label="Questions">${view.list.map((q, k) => `<button type="button" role="tab" class="${cellCls(q)}${k === view.i ? ' cur' : ''}" data-i="${k}" aria-selected="${k === view.i}" aria-label="Question ${k}">${k}</button>`).join('')}</div></div>

function refreshCells() {
  document.querySelectorAll('#arr button').forEach(b => {
    const k = +b.dataset.i; const q = view.list[k];
    b.className = cellCls(q) + (k === view.i ? ' cur' : ''); b.setAttribute('aria-selected', k === view.i);
  });
  const p = document.querySelector('.progress-txt');
  if (p) p.textContent = `solved ${view.base.filter(q => st(q.id) === 'r').length} / ${view.base.filter(q => !q.unsolved).length}`;
  const s = document.querySelector('.bar .stat');
  if (s) s.textContent = `solved ${QB.filter(q => st(q.id) === 'r').length} / ${QB.filter(q => !q.unsolved).length}`;
}
function goto(k) {
  if (!view.list.length) return;
  view.i = Math.max(0, Math.min(view.list.length - 1, k));
  if (view.mode === 'ch') { store.last[view.ch] = view.list[view.i].id; save(); }
  refreshCells(); renderQuestion();
  const cur = document.querySelector('#arr .cur');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduced ? 'auto' : 'smooth' });
}

/* ------------------------------------------------------------------ question rendering */
function stateTag(q) {
  if (q.unsolved) return '<span class="tag ns">Not solved</span>';
  const s = st(q.id);
  return s === 'r' ? '<span class="tag st-b">Solved</span>' : s ? '<span class="tag st-g">Attempted</span>' : '';
}
function renderQuestion() {
  const slot = document.getElementById('qslot');
  const q = view.list[view.i];
  if (!q) { slot.innerHTML = `<div class="qcard"><div class="empty">Nothing here with this filter. Pick another filter above.</div></div>`; return; }
  const u = ui[q.id] || (ui[q.id] = {});
  const chTag = view.mode === 'mix' ? `<span class="tag">Ch ${chById[q.ch].n} · ${esc(chById[q.ch].title)}</span>` : '';
  const figs = figsHTML([q.fig].concat(q.figs || []));
  slot.innerHTML = `<article class="qcard" aria-live="polite">
    <div class="qhead"><span class="qi">Q[${view.i}]</span><span class="tag">${TYPE_NAME[q.type]}</span>${chTag}${stateTag(q)}
      <div class="srcs">${q.src.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>
    <div class="qbody"><div class="qtext">${wrapTables(q.q)}</div>${figs}<div id="ans"></div><div id="solslot"></div></div>
    <div class="qnav"><button class="btn ghost small" type="button" data-prev ${view.i === 0 ? 'disabled' : ''}>← Previous</button>
      <span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd>–<kbd>9</kbd> pick · <kbd>S</kbd> solution</span>
      <button class="btn small" type="button" data-next ${view.i >= view.list.length - 1 ? 'disabled' : ''}>Next →</button></div>
  </article>`;
  renderAnswer(q, u);
  if (u.revealed) showSolution(q, true);
}
function solHTML(q) {
  return `<div class="sol"><div class="sol-h">Solution</div><div class="sol-body">${wrapTables(q.sol || '')}${figsHTML([q.solFig])}</div></div>`;
}
function showSolution(q, silent) {
  const u = ui[q.id] || (ui[q.id] = {});
  const slot = document.getElementById('solslot'); if (!slot || q.unsolved) return;
  if (slot.innerHTML) return;
  slot.innerHTML = solHTML(q); u.revealed = true;
  if (!silent) { mark(q.id, 's'); refreshCells(); }
}
function verdict(ok, extra) {
  return `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? '✓ Correct' : '✗ Not quite'}${extra ? `<span class="hint" style="font-weight:500">${extra}</span>` : ''}</div>`;
}
function renderAnswer(q, u) {
  const box = document.getElementById('ans');
  if (q.unsolved) {
    box.innerHTML = `<div class="missing"><h4>Not solved yet</h4>${q.missing || 'I could not produce a reliable solution for this one.'}</div>
      <div class="field"><label for="note-${q.id}">Your answer (saved on this device)</label><textarea id="note-${q.id}" data-note="${q.id}" placeholder="Write your answer here, then copy it and send it to Claude."></textarea></div>
      <div class="actions"><button class="btn small" type="button" data-copyone>Copy my answer</button></div>
      <textarea class="copybox" id="copyone-box" hidden aria-label="Answer text"></textarea>`;
    box.querySelector('textarea[data-note]').value = store.notes[q.id] || '';
    return;
  }
  if (q.type === 'mcq' || q.type === 'tf') {
    const opts = q.type === 'tf' ? ['True', 'False'] : q.opts;
    const ans = q.type === 'tf' ? [q.ans ? 0 : 1] : [].concat(q.ans);
    const cls = q.type === 'mcq' && (q.bank || q.grid) ? (q.grid ? 'grid' : 'bank') : '';
    const keyOf = k => q.type === 'tf' ? (k ? 'F' : 'T') : (opts.length > 9 ? String.fromCharCode(97 + k) : String.fromCharCode(65 + k));
    box.innerHTML = `<div class="opts ${cls}" role="group" aria-label="Options">${opts.map((o, k) => {
      let c = '';
      if (u.picked != null) { if (ans.includes(k)) c = 'ok'; else if (k === u.picked) c = 'bad'; else c = 'dim'; }
      return `<button type="button" class="opt ${c}" data-opt="${k}" ${u.picked != null ? 'disabled' : ''}><span class="k">${keyOf(k)}</span><span>${o}</span></button>`;
    }).join('')}</div>${u.picked != null ? verdict(ans.includes(u.picked), ans.length > 1 ? 'More than one option is accepted.' : '') + `<div class="actions"><button class="btn ghost small" type="button" data-retry>Try again</button></div>` : `<div class="actions"><button class="btn ghost small" type="button" data-reveal>Show solution</button></div>`}`;
    return;
  }
  if (q.type === 'short') {
    const done = u.result != null;
    box.innerHTML = `<div class="field"><label for="sa-${q.id}">Your answer</label><input id="sa-${q.id}" type="text" autocomplete="off" spellcheck="false" class="${done ? (u.result ? 'ok' : 'bad') : ''}" ${done ? 'disabled' : ''}></div>
      ${done ? verdict(u.result, u.result ? '' : 'Compare with the solution below.') : ''}
      <div class="actions">${done ? (u.result ? '' : `<button class="btn ghost small" type="button" data-self="r">My answer was right</button>`) + `<button class="btn ghost small" type="button" data-retry>Try again</button>` : `<button class="btn small" type="button" data-check>Check</button><button class="btn ghost small" type="button" data-reveal>Show solution</button>`}</div>`;
    box.querySelector('input').value = u.value || '';
    return;
  }
  if (q.type === 'match') {
    const sel = u.sel || (u.sel = q.left.map(() => -1));
    const done = !!u.checked;
    box.innerHTML = `<div class="match">${q.left.map((l, k) => {
      const c = done ? (sel[k] === q.ans[k] ? 'ok' : 'bad') : '';
      return `<div class="row ${c}"><div>${l}</div><select data-m="${k}" ${done ? 'disabled' : ''} aria-label="Match for item ${k + 1}"><option value="-1">Choose…</option>${q.right.map((r, j) => `<option value="${j}" ${sel[k] === j ? 'selected' : ''}>${plain(r)}</option>`).join('')}</select>${done && c === 'bad' ? `<div class="fix">→ ${q.right[q.ans[k]]}</div>` : ''}</div>`;
    }).join('')}</div>
    ${done ? verdict(q.ans.every((a, k) => sel[k] === a), `${q.ans.filter((a, k) => sel[k] === a).length} of ${q.ans.length} matched`) : ''}
    <div class="actions">${done ? `<button class="btn ghost small" type="button" data-retry>Try again</button>` : `<button class="btn small" type="button" data-check>Check</button><button class="btn ghost small" type="button" data-reveal>Show solution</button>`}</div>`;
    return;
  }
  if (q.type === 'order') {
    const seq = u.seq || (u.seq = []);
    const disp = seededShuffle(q.items.map((_, k) => k), hash32(q.id));
    const full = seq.length === q.items.length, done = !!u.checked;
    const ok = done && seq.every((v, k) => v === q.ans[k]);
    box.innerHTML = `<div class="hint" style="margin-top:14px">Click the items from slowest-growing to fastest.</div>
      <div class="order-slots ${done ? (ok ? 'ok' : 'bad') : ''}" aria-label="Your order">${seq.map(k => `<span class="ochip">${q.items[k]}</span>`).join('') || '<span class="hint">empty</span>'}</div>
      <div class="order-pool">${disp.map(k => `<button type="button" class="ochip" data-pick="${k}" ${seq.includes(k) || done ? 'disabled' : ''}>${q.items[k]}</button>`).join('')}</div>
      ${done ? verdict(ok, ok ? '' : 'Correct order: ' + q.ans.map(k => plain(q.items[k])).join(' < ')) : ''}
      <div class="actions">${done ? `<button class="btn ghost small" type="button" data-retry>Try again</button>` : `<button class="btn small" type="button" data-check ${full ? '' : 'disabled'}>Check</button><button class="btn ghost small" type="button" data-undo ${seq.length ? '' : 'disabled'}>Undo</button><button class="btn ghost small" type="button" data-reveal>Show solution</button>`}</div>`;
    return;
  }
  // open problem
  const graded = u.graded;
  box.innerHTML = `<div class="field"><label for="sc-${q.id}">Work it out (saved on this device)</label><textarea id="sc-${q.id}" data-scratch="${q.id}" placeholder="Your working: tables, steps, final answer…"></textarea></div>
    <div class="actions">${u.revealed ? (graded ? `<span class="verdict ${graded === 'r' ? 'ok' : 'bad'}" style="margin:0">${graded === 'r' ? '✓ Marked as solved' : '✗ Marked as missed'}</span>` : `<span class="hint">How did you do?</span><button class="btn small" type="button" data-self="r">I got it</button><button class="btn ghost small" type="button" data-self="w">I missed it</button>`) : `<button class="btn small" type="button" data-reveal>Show solution</button>`}</div>`;
  box.querySelector('textarea').value = (store.notes['s:' + q.id]) || '';
}

/* ------------------------------------------------------------------ interactions */
function currentQ() { return view.list[view.i]; }
function pickOption(k) {
  const q = currentQ(); if (!q || !(q.type === 'mcq' || q.type === 'tf') || q.unsolved) return;
  const u = ui[q.id] || (ui[q.id] = {}); if (u.picked != null) return;
  const opts = q.type === 'tf' ? 2 : q.opts.length; if (k < 0 || k >= opts) return;
  const ans = q.type === 'tf' ? [q.ans ? 0 : 1] : [].concat(q.ans);
  u.picked = k; mark(q.id, ans.includes(k) ? 'r' : 'w');
  renderAnswer(q, u); showSolution(q, true); u.revealed = true; refreshCells(); updateStateTag(q);
}
function updateStateTag(q) {
  const head = document.querySelector('.qhead'); if (!head) return;
  head.querySelectorAll('.tag.st-b, .tag.st-g').forEach(t => t.remove());
  const t = stateTag(q); if (t && !q.unsolved) head.querySelector('.srcs').insertAdjacentHTML('beforebegin', t);
}
const normAns = s => String(s).toLowerCase().replace(/[−–]/g, '-').replace(/^\s*[oθ]\s*\((.*)\)\s*$/i, '$1').replace(/[\s()]/g, '').replace(/\^/g, '').replace(/²/g, '2').replace(/ⁿ/g, 'n');

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-ch], a[data-home]'); if (!t) return;
  if (t.matches('[data-home]')) { e.preventDefault(); goHome(); return; }
  if (t.id === 'theme-btn') { toggleTheme(); return; }
  if (t.matches('[data-mix]') || t.matches('[data-redraw]')) { openMix(); return; }
  if (t.dataset.ch && !t.closest('#qslot')) { openChapter(t.dataset.ch); return; }
  if (t.id === 'reset-btn') {
    if (t.dataset.armed) { store.p = {}; store.notes = {}; store.last = {}; save(); Object.keys(ui).forEach(k => delete ui[k]); toast('Progress reset'); renderHome(); }
    else { t.dataset.armed = '1'; t.textContent = 'Click again to erase all progress'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Reset all progress'; } }, 3500); }
    return;
  }
  if (t.id === 'exp-btn') { copyText(unsolvedExport(), document.getElementById('exp-box')); return; }
  if (t.dataset.filter) {
    view.filter = t.dataset.filter; const curId = currentQ() && currentQ().id;
    let l = filterList(view.base, view.filter); if (view.shuffled) l = shuffle(l);
    view.list = l; const k = l.findIndex(q => q.id === curId); view.i = k >= 0 ? k : 0;
    renderChapter(); return;
  }
  if (t.matches('[data-shuffle]')) {
    view.shuffled = !view.shuffled; const curId = currentQ() && currentQ().id;
    const l = filterList(view.base, view.filter); view.list = view.shuffled ? shuffle(l) : l;
    const k = view.list.findIndex(q => q.id === curId); view.i = view.shuffled ? 0 : Math.max(0, k);
    renderChapter(); return;
  }
  if (t.closest('#arr') && t.dataset.i != null) { goto(+t.dataset.i); return; }
  if (t.matches('[data-prev]')) { goto(view.i - 1); return; }
  if (t.matches('[data-next]')) { goto(view.i + 1); return; }

  const q = currentQ(); if (!q) return; const u = ui[q.id] || (ui[q.id] = {});
  if (t.dataset.opt != null) { pickOption(+t.dataset.opt); return; }
  if (t.matches('[data-reveal]')) { showSolution(q); renderAnswer(q, u); updateStateTag(q); return; }
  if (t.matches('[data-retry]')) { delete u.picked; delete u.result; delete u.checked; u.seq = []; if (q.type === 'match') u.sel = q.left.map(() => -1); renderAnswer(q, u); return; }
  if (t.matches('[data-self]')) {
    mark(q.id, t.dataset.self); u.graded = t.dataset.self; if (q.type === 'short') u.result = t.dataset.self === 'r';
    if (!u.revealed) showSolution(q, true); u.revealed = true; renderAnswer(q, u); refreshCells(); updateStateTag(q); return;
  }
  if (t.matches('[data-check]')) {
    if (q.type === 'short') {
      const v = document.querySelector('#ans input').value; u.value = v; if (!v.trim()) return;
      const ok = (q.accept || []).some(a => normAns(a) === normAns(v));
      u.result = ok; mark(q.id, ok ? 'r' : 'w'); showSolution(q, true); u.revealed = true;
    } else if (q.type === 'match') {
      if (u.sel.some(x => x < 0)) { toast('Match every item first'); return; }
      u.checked = true; const ok = q.ans.every((a, k) => u.sel[k] === a); mark(q.id, ok ? 'r' : 'w'); showSolution(q, true); u.revealed = true;
    } else if (q.type === 'order') {
      u.checked = true; const ok = u.seq.every((v, k) => v === q.ans[k]); mark(q.id, ok ? 'r' : 'w'); showSolution(q, true); u.revealed = true;
    }
    renderAnswer(q, u); refreshCells(); updateStateTag(q); return;
  }
  if (t.dataset.pick != null) { u.seq = (u.seq || []).concat(+t.dataset.pick); renderAnswer(q, u); return; }
  if (t.matches('[data-undo]')) { u.seq = (u.seq || []).slice(0, -1); renderAnswer(q, u); return; }
  if (t.matches('[data-copyone]')) {
    const text = `[${q.id}] ${chById[q.ch].title} · ${q.src.join(', ')}\nQ: ${plain(q.q)}\nMy answer: ${(store.notes[q.id] || '').trim() || '(empty)'}`;
    copyText(text, document.getElementById('copyone-box')); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#chgraph .v') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openChapter(e.target.closest('.v').dataset.ch); return; }
  if (view.mode === 'home') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Enter' && tag === 'input') { const b = document.querySelector('#ans [data-check]'); if (b) b.click(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') { goto(view.i + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { goto(view.i - 1); e.preventDefault(); }
  else if (e.key === 's' || e.key === 'S') { const b = document.querySelector('#ans [data-reveal]'); if (b) b.click(); }
  else if (/^[1-9]$/.test(e.key)) pickOption(+e.key - 1);
  else if (/^[a-l]$/i.test(e.key)) { const q = currentQ(); if (q && q.type === 'mcq') pickOption(e.key.toLowerCase().charCodeAt(0) - 97); else if (q && q.type === 'tf' && /^[tf]$/i.test(e.key)) pickOption(e.key.toLowerCase() === 't' ? 0 : 1); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) { store.notes[t.dataset.note] = t.value; save(); refreshCells(); }
  else if (t.dataset && t.dataset.scratch) { store.notes['s:' + t.dataset.scratch] = t.value; save(); }
  else if (t.matches && t.matches('#ans input')) { const q = currentQ(); if (q) (ui[q.id] || (ui[q.id] = {})).value = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || t.dataset.m == null) return;
  const q = currentQ(); const u = ui[q.id] || (ui[q.id] = {}); u.sel[+t.dataset.m] = +t.value;
});

function goHome() { stopTimers(); setHash(''); renderHome(); window.scrollTo(0, 0); }
function route() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('ch-') && chById[h.slice(3)]) openChapter(h.slice(3), true);
  else if (h === 'mix') openMix(true);
  else { stopTimers(); renderHome(); }
}
window.addEventListener('popstate', route);
route();
})();

</script>
